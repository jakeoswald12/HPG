<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bull Sale Check-In — Operator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #86868b;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --success: #30d158;
    --success-bg: #e8f7ed;
    --danger: #ff3b30;
    --border: #d2d2d7;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
    --radius: 12px;
    --radius-lg: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Header ─── */
  .header {
    background: transparent;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; }

  .logo-area { height: 60px; flex-shrink: 0; }
  .logo-area img { height: 100%; width: auto; display: block; }

  .header-text .title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .header-text .subtitle { font-size: 12px; color: var(--text-secondary); }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .badge {
    padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600;
    background: var(--success-bg); color: #1a7f37;
  }

  .settings-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all .15s;
  }
  .settings-btn:hover { background: var(--bg); }

  /* ─── Main ─── */
  .main { max-width: 860px; margin: 0 auto; padding: 28px 20px; }

  /* ─── Search ─── */
  .search-card {
    background: var(--card-bg); border-radius: var(--radius-lg);
    padding: 28px; box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .search-card .label {
    font-size: 11px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .6px; margin-bottom: 14px;
  }
  .search-row { display: flex; gap: 12px; }
  .search-row .field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .search-row .field label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }

  input {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 15px; font-family: inherit;
    transition: all .2s; outline: none; background: var(--bg);
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,.12); background: #fff; }

  .search-btn {
    margin-top: 16px; width: 100%; padding: 13px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .search-btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,113,227,.25); }
  .search-btn:active { transform: translateY(0); }

  /* ─── Results ─── */
  .results { display: none; }
  .results-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .results-count { font-size: 14px; color: var(--text-secondary); font-weight: 500; }

  .btn-outline {
    padding: 9px 18px; border-radius: var(--radius);
    border: 1.5px solid var(--text); background: transparent;
    color: var(--text); font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .btn-outline:hover { background: var(--text); color: #fff; }

  /* ─── Card ─── */
  .card {
    background: var(--card-bg); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 22px; margin-bottom: 14px;
    display: flex; gap: 18px; cursor: pointer;
    transition: all .3s cubic-bezier(.25,.46,.45,.94);
    border: 2px solid transparent;
    opacity: 0; transform: translateY(10px);
    animation: fadeUp .35s ease forwards;
  }
  .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,.12), var(--shadow-lg); }

  @keyframes fadeUp { to { opacity:1; transform: translateY(0); } }

  .card-num {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--text); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; flex-shrink: 0;
  }
  .card.selected .card-num { background: var(--accent); }

  .card-body { flex: 1; min-width: 0; }
  .card-name { font-size: 17px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 2px; }
  .card-biz { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .detail-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .4px; font-weight: 600; }
  .detail-value { font-size: 13px; font-weight: 500; word-break: break-word; }
  .detail-value.empty { color: var(--border); font-style: italic; font-weight: 400; }

  /* ─── Edit panel ─── */
  .edit-panel {
    background: var(--card-bg); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding: 28px; margin-top: 20px;
    display: none; animation: slideUp .3s ease;
  }
  .edit-panel.visible { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .edit-title { font-size: 17px; font-weight: 600; margin-bottom: 18px; letter-spacing: -.3px; }

  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .edit-grid .field { display: flex; flex-direction: column; gap: 5px; }
  .edit-grid .field label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .edit-grid .full { grid-column: 1 / -1; }

  .edit-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }

  .btn-cancel {
    padding: 11px 22px; background: var(--bg); color: var(--text);
    border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all .2s;
  }
  .btn-cancel:hover { background: #e8e8ed; }

  .btn-primary {
    padding: 11px 28px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all .2s;
  }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,113,227,.25); }

  .btn-success {
    padding: 11px 28px; background: var(--success); color: #fff;
    border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all .2s;
  }
  .btn-success:hover { background: #28b84d; transform: translateY(-1px); }

  /* ─── Toast ─── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text); color: #fff;
    padding: 26px 52px; border-radius: 100px;
    font-size: 28px; font-weight: 500; box-shadow: var(--shadow-lg);
    transition: transform .4s cubic-bezier(.25,.46,.45,.94);
    z-index: 200; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ─── Settings modal ─── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
    z-index: 300; align-items: center; justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: var(--card-bg); border-radius: var(--radius-lg);
    padding: 32px; width: 440px; max-width: 90vw; box-shadow: var(--shadow-lg);
    animation: slideUp .3s ease;
  }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; line-height: 1.5; }
  .modal input { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* ─── Empty ─── */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
  .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: .35; }
  .empty-title { font-size: 15px; font-weight: 500; }
  .empty-sub { font-size: 13px; margin-top: 4px; }

  /* ─── Checked-in badge ─── */
  .checked-in-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--success-bg); color: #1a7f37;
    padding: 4px 10px; border-radius: 100px;
    font-size: 11px; font-weight: 600; margin-top: 6px;
  }

  /* ─── Check-in button loading state ─── */
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-success.loading {
    opacity: 0.85; cursor: not-allowed; pointer-events: none;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-success.loading::before {
    content: '';
    width: 14px; height: 14px; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo-area"><img src="/logo.png" alt="High Point Genetics"></div>
  </div>
</header>

<main class="main">
  <!-- Search -->
  <section class="search-card">
    <div class="label">Customer Lookup</div>
    <div class="search-row">
      <div class="field">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="e.g. John" autocomplete="off">
      </div>
      <div class="field">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="e.g. Smith" autocomplete="off">
      </div>
    </div>
    <button class="search-btn" id="searchBtn">Search</button>
  </section>

  <!-- Results -->
  <section class="results" id="resultsSection">
    <div class="results-bar">
      <span class="results-count" id="resultsCount"></span>
      <button class="btn-outline" id="addNewBtn">+ New Customer</button>
    </div>
    <div id="resultsList"></div>
  </section>

  <!-- Edit / Check-in panel -->
  <section class="edit-panel" id="editPanel">
    <div class="edit-title" id="editTitle">Edit Customer</div>
    <div class="edit-grid">
      <div class="field">
        <label for="eFirst">First Name</label>
        <input type="text" id="eFirst">
      </div>
      <div class="field">
        <label for="eLast">Last Name</label>
        <input type="text" id="eLast">
      </div>
      <div class="field">
        <label for="eBiz">Business</label>
        <input type="text" id="eBiz">
      </div>
      <div class="field full">
        <label for="eAddr">Address</label>
        <input type="text" id="eAddr">
      </div>
      <div class="field">
        <label for="eCity">City</label>
        <input type="text" id="eCity">
      </div>
      <div class="field">
        <label for="eState">State</label>
        <input type="text" id="eState">
      </div>
      <div class="field">
        <label for="eZip">ZIP</label>
        <input type="text" id="eZip">
      </div>
      <div class="field">
        <label for="ePhone">Phone</label>
        <input type="text" id="ePhone">
      </div>
      <div class="field">
        <label for="eEmail">Email</label>
        <input type="text" id="eEmail">
      </div>
    </div>
    <div class="edit-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save Changes</button>
      <button class="btn-success" id="checkinBtn">&#10003; Check In</button>
    </div>
  </section>
</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Settings modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Google Sheets Connection</h2>
    <p>Paste your deployed Google Apps Script web app URL below. Checked-in buyers will be written to the Buyers tab of your Google Sheet.</p>
    <input type="text" id="sheetsUrl" placeholder="https://script.google.com/macros/s/...">
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Cancel</button>
      <button class="btn-primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<script>
const channel = new BroadcastChannel('bull-sale-checkin');
let results = [];
let selectedIdx = -1;
let editingRowIndex = null;
let isNew = false;

const $ = id => document.getElementById(id);

// ─── Search ──────────────────────────────────────────
$('searchBtn').onclick = doSearch;
$('firstName').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); }};
$('lastName').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); }};

async function doSearch() {
  const first = $('firstName').value.trim();
  const last = $('lastName').value.trim();
  if (!first && !last) return;

  const params = new URLSearchParams();
  if (first) params.set('first', first);
  if (last) params.set('last', last);

  const res = await fetch('/api/customers/search?' + params);
  results = await res.json();
  selectedIdx = -1;
  editingRowIndex = null;
  isNew = false;
  $('editPanel').classList.remove('visible');
  renderResults();
  $('resultsSection').style.display = 'block';

  channel.postMessage({ type: 'search', results, query: { first, last } });
}

function renderResults() {
  $('resultsCount').textContent = results.length + ' record' + (results.length !== 1 ? 's' : '') + ' found';

  if (!results.length) {
    $('resultsList').innerHTML = '<div class="empty"><div class="empty-icon">&#128269;</div><div class="empty-title">No matching records</div><div class="empty-sub">Try a different name or add a new customer</div></div>';
    return;
  }

  $('resultsList').innerHTML = results.map((c, i) => {
    const addr = [c.Address, [c.City, c.State, c.Zip].filter(Boolean).join(', ')].filter(Boolean).join('<br>') || '<span class="detail-value empty">Not on file</span>';
    return `
    <div class="card ${selectedIdx===i?'selected':''}" onclick="selectCard(${i})" style="animation-delay:${i*.07}s">
      <div class="card-num">${i+1}</div>
      <div class="card-body">
        <div class="card-name">${esc(c['First Name'])} ${esc(c['Last Name'])}</div>
        <div class="card-biz">${c.Business ? esc(c.Business) : '<span style="color:var(--border)">No business listed</span>'}</div>
        <div class="card-grid">
          <div><div class="detail-label">Address</div><div class="detail-value">${addr}</div></div>
          <div><div class="detail-label">Phone</div><div class="detail-value ${c.Phone?'':'empty'}">${esc(c.Phone)||'Not on file'}</div></div>
          <div><div class="detail-label">Email</div><div class="detail-value ${extractEmail(c)?'':'empty'}">${esc(extractEmail(c))||'Not on file'}</div></div>
          <div><div class="detail-label">Notes</div><div class="detail-value ${c.Miscellaneous?'':'empty'}">${esc(c.Miscellaneous)||'—'}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function extractEmail(c) {
  // Email might be in Miscellaneous or a dedicated field
  if (c.Email) return c.Email;
  const misc = c.Miscellaneous || '';
  const m = misc.match(/[\w.-]+@[\w.-]+\.\w+/);
  return m ? m[0] : '';
}

function selectCard(i) {
  selectedIdx = i;
  isNew = false;
  const c = results[i];
  editingRowIndex = c._index;

  $('editTitle').textContent = 'Edit — ' + c['First Name'] + ' ' + c['Last Name'];
  $('eFirst').value = c['First Name'] || '';
  $('eLast').value = c['Last Name'] || '';
  $('eBiz').value = c['Business'] || '';
  $('eAddr').value = c['Address'] || '';
  $('eCity').value = c['City'] || '';
  $('eState').value = c['State'] || '';
  $('eZip').value = c['Zip'] || '';
  $('ePhone').value = c['Phone'] || '';
  $('eEmail').value = extractEmail(c);

  $('saveBtn').textContent = 'Save Changes';
  $('checkinBtn').style.display = '';
  $('editPanel').classList.add('visible');
  renderResults();

  channel.postMessage({ type: 'selected', index: i });
  $('editPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── Add new ─────────────────────────────────────────
$('addNewBtn').onclick = () => {
  isNew = true;
  selectedIdx = -1;
  editingRowIndex = null;
  $('editTitle').textContent = 'Add New Customer';
  $('saveBtn').textContent = 'Add Customer';
  $('checkinBtn').style.display = '';
  $('eFirst').value = $('firstName').value.trim();
  $('eLast').value = $('lastName').value.trim();
  $('eBiz').value = '';
  $('eAddr').value = '';
  $('eCity').value = '';
  $('eState').value = '';
  $('eZip').value = '';
  $('ePhone').value = '';
  $('eEmail').value = '';
  $('editPanel').classList.add('visible');
  renderResults();
  $('editPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
};

// ─── Cancel ──────────────────────────────────────────
$('cancelBtn').onclick = () => {
  $('editPanel').classList.remove('visible');
  selectedIdx = -1;
  renderResults();
  channel.postMessage({ type: 'selected', index: -1 });
};

// ─── Save to CRM ────────────────────────────────────
$('saveBtn').onclick = async () => {
  const data = getEditFields();
  try {
    let res;
    if (isNew) {
      res = await fetch('/api/customers', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    } else {
      res = await fetch('/api/customers/' + editingRowIndex, { method: 'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    }
    if (res.ok) {
      toast(isNew ? 'Customer added to CRM' : 'CRM updated');
      await doSearch();
    } else {
      toast('Error saving — try again');
    }
  } catch(e) { toast('Connection error'); }
};

// ─── Check In (save + assign buyer # + write to Sheets) ─────
$('checkinBtn').onclick = async () => {
  const btn = $('checkinBtn');
  const originalText = btn.textContent;

  // Show loading state
  btn.classList.add('loading');
  btn.textContent = 'Processing…';

  const data = getEditFields();

  // 1. Save to CRM first
  try {
    if (isNew) {
      await fetch('/api/customers', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    } else if (editingRowIndex !== null) {
      await fetch('/api/customers/' + editingRowIndex, { method: 'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    }
  } catch(e) { /* continue anyway */ }

  // 2. Write to Google Sheets (this is the source of truth for buyer numbers)
  try {
    const buyer = {
      lastName: data['Last Name'],
      firstName: data['First Name'],
      fullName: (data['First Name'] + ' ' + data['Last Name']).trim(),
      address: data['Address'],
      city: data['City'],
      state: data['State'],
      zip: data['Zip'],
      phone: data['Phone'],
      email: $('eEmail').value.trim()
    };

    const sheetsRes = await fetch('/api/sheets/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buyer)
    });
    const sheetsData = await sheetsRes.json();

    if (!sheetsRes.ok || !sheetsData.ok) {
      const errMsg = sheetsData.error || 'unknown error';
      console.error('Sheets write failed:', sheetsData);
      toast('Check-in failed — ' + errMsg);
      btn.classList.remove('loading');
      btn.textContent = originalText;
      return;
    }

    // Parse the buyer number from the Sheets response
    let buyerNum = '?';
    try {
      const parsed = JSON.parse(sheetsData.response);
      if (parsed.error) {
        toast('Check-in failed — ' + parsed.error);
        btn.classList.remove('loading');
        btn.textContent = originalText;
        return;
      }
      buyerNum = parsed.buyerNumber;
    } catch(e) {
      console.error('Could not parse sheets response:', sheetsData.response);
    }

    toast('Checked in as Buyer #' + buyerNum);

    // Broadcast to customer screen
    channel.postMessage({ type: 'checked-in', buyerNumber: buyerNum, buyer });

    $('editPanel').classList.remove('visible');
    selectedIdx = -1;
    btn.classList.remove('loading');
    btn.textContent = originalText;
    await doSearch();
  } catch(e) {
    console.error('Check-in error:', e);
    toast('Check-in error — try again');
    btn.classList.remove('loading');
    btn.textContent = originalText;
  }
};

function getEditFields() {
  return {
    'First Name': $('eFirst').value.trim(),
    'Last Name': $('eLast').value.trim(),
    'Business': $('eBiz').value.trim(),
    'Address': $('eAddr').value.trim(),
    'City': $('eCity').value.trim(),
    'State': $('eState').value.trim(),
    'Zip': $('eZip').value.trim(),
    'Phone': $('ePhone').value.trim(),
    'Miscellaneous': '',
    'Email': $('eEmail').value.trim()
  };
}


// ─── Helpers ─────────────────────────────────────────
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  setTimeout(() => $('toast').classList.remove('show'), 5600);
}
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

$('firstName').focus();

</script>

</body>
</html>
